<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-label="Measured results so far: speed flat from 1K to 12M tokens of history (pilot, n=40 per cell); decode speed 74 to 167 tok/s (n=900 per arm); entity identity AUROC about 0.78 versus about 0.5 control (n=400 pairs per cell)." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title>Measured results so far: speed flat from 1K to 12M tokens of history (pilot, n=40 per cell); decode speed 74 to 167 tok/s (n=900 per arm); entity identity AUROC about 0.78 versus about 0.5 control (n=400 pairs per cell).</title><defs><linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#3A2BD6"/><stop offset="0.50" stop-color="#0B7FD1"/><stop offset="1.00" stop-color="#00A58E"/></linearGradient></defs><rect x=".5" y="0.5" width="639" height="329" rx="20" fill="#FFFFFF" stroke="#E4E8EF"/><rect x="32" y="0" width="44" height="4" rx="2" fill="url(#tx)"/><text x="32" y="54" font-size="17" fill="#6B7280" font-weight="700" letter-spacing="2">SPEED VS HISTORY LENGTH</text><text x="32" y="124" font-size="62" fill="url(#tx)" font-weight="700" letter-spacing="-1">1K → 12M</text><text x="32" y="162" font-size="23" fill="#374151" font-weight="500">tokens of history, flat speed</text><text x="32" y="204" font-size="21" fill="#6B7280">about 200–240 tok/s, single stream</text><text x="32" y="234" font-size="21" fill="#6B7280">about 550–600 tok/s, parallel</text><line x1="32" y1="258" x2="608" y2="258" stroke="#E4E8EF"/><text x="32" y="298" font-size="20" fill="#374151" font-weight="600">n=40 per cell</text><rect x="352" y="274" width="256" height="36" rx="18" fill="#FEF3C7"/><text x="480" y="298" font-size="15" fill="#B45309" font-weight="700" text-anchor="middle" letter-spacing="1">PILOT, NOT CLAIMABLE</text><rect x=".5" y="350.5" width="639" height="329" rx="20" fill="#FFFFFF" stroke="#E4E8EF"/><rect x="32" y="350" width="44" height="4" rx="2" fill="url(#tx)"/><text x="32" y="404" font-size="17" fill="#6B7280" font-weight="700" letter-spacing="2">DECODE SPEED</text><text x="32" y="474" font-size="62" fill="url(#tx)" font-weight="700" letter-spacing="-1">74 → 167</text><text x="32" y="512" font-size="23" fill="#374151" font-weight="500">tok/s, one decoding change</text><text x="32" y="554" font-size="21" fill="#6B7280">Measures one decoding change,</text><text x="32" y="584" font-size="21" fill="#6B7280">not the full system</text><line x1="32" y1="608" x2="608" y2="608" stroke="#E4E8EF"/><text x="32" y="648" font-size="20" fill="#374151" font-weight="600">n=900 per arm · single cloud GPU</text><rect x=".5" y="700.5" width="639" height="329" rx="20" fill="#FFFFFF" stroke="#E4E8EF"/><rect x="32" y="700" width="44" height="4" rx="2" fill="url(#tx)"/><text x="32" y="754" font-size="17" fill="#6B7280" font-weight="700" letter-spacing="2">ENTITY IDENTITY, FROZEN MODEL</text><text x="32" y="824" font-size="62" fill="url(#tx)" font-weight="700" letter-spacing="-1">AUROC ~0.78</text><text x="32" y="862" font-size="23" fill="#374151" font-weight="500">range 0.76–0.79, no word overlap</text><text x="32" y="904" font-size="21" fill="#6B7280">vs ~0.5 for a randomly</text><text x="32" y="934" font-size="21" fill="#6B7280">initialised control</text><line x1="32" y1="958" x2="608" y2="958" stroke="#E4E8EF"/><text x="32" y="998" font-size="20" fill="#374151" font-weight="600">n=400 pairs per cell · diagnostic only</text></svg>
