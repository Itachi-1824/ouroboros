<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Measured results so far: speed flat from 1K to 12M tokens of history (pilot, n=40 per cell); decode speed 74 to 167 tok/s (n=900 per arm); entity identity AUROC about 0.78 versus about 0.5 control (n=400 pairs per cell)." font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title>Measured results so far: speed flat from 1K to 12M tokens of history (pilot, n=40 per cell); decode speed 74 to 167 tok/s (n=900 per arm); entity identity AUROC about 0.78 versus about 0.5 control (n=400 pairs per cell).</title><defs><linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0.00" stop-color="#4B3BFF"/><stop offset="0.50" stop-color="#1FA8FF"/><stop offset="1.00" stop-color="#3FF2D2"/></linearGradient></defs><rect x="0.5" y=".5" width="383.0" height="339" rx="18" fill="#11161F" stroke="#232A35"/><rect x="28.0" y="0" width="36" height="3" rx="1.5" fill="url(#tx)"/><text x="28.0" y="50" font-size="13" fill="#8B95A3" font-weight="700" letter-spacing="1.6">SPEED VS HISTORY LENGTH</text><text x="28.0" y="114" font-size="50" fill="url(#tx)" font-weight="700" letter-spacing="-1">1K → 12M</text><text x="28.0" y="146" font-size="18" fill="#C9D1DC" font-weight="500">tokens of history, flat speed</text><text x="28.0" y="196" font-size="17" fill="#8B95A3">about 200–240 tok/s, single stream</text><text x="28.0" y="221" font-size="17" fill="#8B95A3">about 550–600 tok/s, parallel</text><line x1="28.0" y1="264" x2="356.0" y2="264" stroke="#232A35"/><text x="28.0" y="302" font-size="15.5" fill="#C9D1DC" font-weight="600">n=40 per cell</text><rect x="160.0" y="281" width="196" height="30" rx="15" fill="#2A2110"/><text x="258.0" y="301" font-size="12" fill="#FBBF24" font-weight="700" text-anchor="middle" letter-spacing="1">PILOT, NOT CLAIMABLE</text><rect x="408.5" y=".5" width="383.0" height="339" rx="18" fill="#11161F" stroke="#232A35"/><rect x="436.0" y="0" width="36" height="3" rx="1.5" fill="url(#tx)"/><text x="436.0" y="50" font-size="13" fill="#8B95A3" font-weight="700" letter-spacing="1.6">DECODE SPEED</text><text x="436.0" y="114" font-size="50" fill="url(#tx)" font-weight="700" letter-spacing="-1">74 → 167</text><text x="436.0" y="146" font-size="18" fill="#C9D1DC" font-weight="500">tok/s, one decoding change</text><text x="436.0" y="196" font-size="17" fill="#8B95A3">Measures one decoding change,</text><text x="436.0" y="221" font-size="17" fill="#8B95A3">not the full system</text><line x1="436.0" y1="264" x2="764.0" y2="264" stroke="#232A35"/><text x="436.0" y="302" font-size="15.5" fill="#C9D1DC" font-weight="600">n=900 per arm · single cloud GPU</text><rect x="816.5" y=".5" width="383.0" height="339" rx="18" fill="#11161F" stroke="#232A35"/><rect x="844.0" y="0" width="36" height="3" rx="1.5" fill="url(#tx)"/><text x="844.0" y="50" font-size="13" fill="#8B95A3" font-weight="700" letter-spacing="1.6">ENTITY IDENTITY, FROZEN MODEL</text><text x="844.0" y="114" font-size="50" fill="url(#tx)" font-weight="700" letter-spacing="-1">AUROC ~0.78</text><text x="844.0" y="146" font-size="18" fill="#C9D1DC" font-weight="500">range 0.76–0.79, no word overlap</text><text x="844.0" y="196" font-size="17" fill="#8B95A3">vs ~0.5 for a randomly</text><text x="844.0" y="221" font-size="17" fill="#8B95A3">initialised control</text><line x1="844.0" y1="264" x2="1172.0" y2="264" stroke="#232A35"/><text x="844.0" y="302" font-size="15.5" fill="#C9D1DC" font-weight="600">n=400 pairs per cell · diagnostic only</text></svg>
