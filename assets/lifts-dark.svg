<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="820" height="440" fill="#0d1117"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#E6EDF3">Each mechanism earned its result — before → after</text>
  <text x="40" y="66" font-size="13" fill="#8B949E">Pre-registered, anti-cheated ablations. Prototype scale (~1M params, one 8&#8202;GB laptop GPU).</text>

  <line x1="250" y1="100" x2="250" y2="380" stroke="#30363D" stroke-width="1"/>
  <line x1="250" y1="380" x2="780" y2="380" stroke="#30363D" stroke-width="1"/>
  <text x="250" y="404" font-size="11" fill="#6E7681">0.0</text>
  <text x="510" y="404" font-size="11" fill="#6E7681" text-anchor="middle">0.5</text>
  <text x="775" y="404" font-size="11" fill="#6E7681" text-anchor="end">1.0</text>

  <text x="238" y="132" font-size="13" fill="#C9D1D9" text-anchor="end">Recall (16k-fact store)</text>
  <rect x="250" y="118" width="53" height="18" rx="3" fill="#D9913F"/>
  <rect x="250" y="118" width="530" height="18" rx="3" fill="none" stroke="#3FB6A8" stroke-width="1.5"/>
  <rect x="250" y="118" width="530" height="18" rx="3" fill="#3FB6A8" fill-opacity="0.20"/>
  <text x="308" y="132" font-size="12" fill="#E0A860">0.101</text>
  <text x="775" y="132" font-size="12" font-weight="700" fill="#5FD3C4" text-anchor="end">1.000</text>

  <text x="238" y="182" font-size="13" fill="#C9D1D9" text-anchor="end">Binding, solved in the value</text>
  <rect x="250" y="168" width="232" height="18" rx="3" fill="#D9913F"/>
  <rect x="250" y="168" width="529" height="18" rx="3" fill="none" stroke="#3FB6A8" stroke-width="1.5"/>
  <rect x="250" y="168" width="529" height="18" rx="3" fill="#3FB6A8" fill-opacity="0.20"/>
  <text x="490" y="182" font-size="12" fill="#E0A860">0.438</text>
  <text x="775" y="182" font-size="12" font-weight="700" fill="#5FD3C4" text-anchor="end">0.998</text>

  <text x="238" y="232" font-size="13" fill="#C9D1D9" text-anchor="end">Curiosity study-selection</text>
  <rect x="250" y="218" width="317" height="18" rx="3" fill="#D9913F"/>
  <rect x="250" y="218" width="527" height="18" rx="3" fill="none" stroke="#3FB6A8" stroke-width="1.5"/>
  <rect x="250" y="218" width="527" height="18" rx="3" fill="#3FB6A8" fill-opacity="0.20"/>
  <text x="575" y="232" font-size="12" fill="#E0A860">0.599</text>
  <text x="775" y="232" font-size="12" font-weight="700" fill="#5FD3C4" text-anchor="end">0.994 &#8776; oracle</text>

  <text x="238" y="282" font-size="13" fill="#C9D1D9" text-anchor="end">Runtime facts survive wipe</text>
  <rect x="250" y="268" width="3" height="18" rx="3" fill="#D9913F"/>
  <rect x="250" y="268" width="530" height="18" rx="3" fill="none" stroke="#3FB6A8" stroke-width="1.5"/>
  <rect x="250" y="268" width="530" height="18" rx="3" fill="#3FB6A8" fill-opacity="0.20"/>
  <text x="262" y="282" font-size="12" fill="#E0A860">0.000</text>
  <text x="775" y="282" font-size="12" font-weight="700" fill="#5FD3C4" text-anchor="end">1.000</text>

  <text x="238" y="332" font-size="13" fill="#C9D1D9" text-anchor="end">Hallucination (lower better)</text>
  <rect x="250" y="318" width="530" height="18" rx="3" fill="#D9913F" fill-opacity="0.35"/>
  <rect x="250" y="318" width="3" height="18" rx="3" fill="#3FB6A8"/>
  <text x="775" y="332" font-size="12" fill="#E0A860" text-anchor="end">was 1.000</text>
  <text x="262" y="332" font-size="12" font-weight="700" fill="#5FD3C4">0.000</text>

  <rect x="250" y="360" width="12" height="12" rx="2" fill="#D9913F"/>
  <text x="268" y="370" font-size="12" fill="#8B949E">baseline / control</text>
  <rect x="410" y="360" width="12" height="12" rx="2" fill="#3FB6A8" fill-opacity="0.5" stroke="#3FB6A8"/>
  <text x="428" y="370" font-size="12" fill="#8B949E">with the mechanism</text>
